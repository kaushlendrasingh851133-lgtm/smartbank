
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartBank | Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef3fa;
            font-family: Arial, sans-serif;
            padding: 20px 0;
        }

        .card {
            width: 390px;
            max-width: 92%;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px #142b4d18;
        }

        h1 {
            color: #123b72;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #344054;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #155eef;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #155eef;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #104ac0;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .error {
            color: #c62828;
            text-align: center;
        }

        .success {
            color: #188038;
            text-align: center;
        }

        .otp-box {
            margin-top: 20px;
            padding: 15px;
            background: #eef5ff;
            border: 1px solid #b9d2ff;
            border-radius: 10px;
            text-align: center;
        }

        .otp {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 6px;
            color: #155eef;
            margin: 12px 0;
        }

        a {
            color: #155eef;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

<div class="card">

    <h1>SmartBank</h1>

    <p class="subtitle">
        Forgot your password?
        Enter your registered email to reset it.
    </p>

    <!-- Error Message -->
    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <!-- Success Message -->
    <p class="success"
       th:if="${success}"
       th:text="${success}">
    </p>

    <!-- Email Form -->
    <form th:action="@{/forgot-password}" method="post">

        <label>Registered Email Address</label>

        <input type="email"
               name="email"
               placeholder="Enter your registered email"
               required>

        <button type="submit">
            Generate OTP
        </button>

    </form>

    <!-- Generated OTP -->
    <div class="otp-box" th:if="${generatedOtp != null}">

        <p class="success">
            Your Verification Code
        </p>

        <div class="otp" th:text="${generatedOtp}"></div>

    </div>

    <!-- OTP Verification Form -->
    <form th:if="${generatedOtp != null}"
          th:action="@{/verify-otp}"
          method="post">

        <label>Enter Verification Code</label>

        <input type="text"
               name="otp"
               placeholder="Enter 6 digit OTP"
               pattern="[0-9]{6}"
               maxlength="6"
               inputmode="numeric"
               required>

        <button type="submit">
            Verify OTP
        </button>

    </form>

    <p class="message">
        <a th:href="@{/login}">
            ← Back to Login
        </a>
    </p>

</div>

</body>
</html>
