<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartBank | Reset Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef3fa;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 390px;
            max-width: 92%;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px #142b4d18;
        }

        h1 {
            color: #123b72;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #344054;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #155eef;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 8px;
            background: #155eef;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #104ac0;
        }

        .error {
            color: #c62828;
            text-align: center;
            margin-top: 15px;
        }

        .message {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #155eef;
            text-decoration: none;
        }

        .hint {
            color: #667085;
            font-size: 12px;
            margin-top: 7px;
        }
    </style>

</head>

<body>

<div class="card">

    <h1>SmartBank</h1>

    <p class="subtitle">
        Create a new password for your account.
    </p>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <form th:action="@{/complete-password-reset}"
          method="post">

        <label>New Password</label>

        <input type="password"
               id="newPassword"
               name="newPassword"
               placeholder="Enter new password"
               minlength="8"
               maxlength="72"
               autocomplete="new-password"
               required>

        <p class="hint">
            Password must contain at least 8 characters.
        </p>

        <label>Confirm New Password</label>

        <input type="password"
               id="confirmPassword"
               name="confirmPassword"
               placeholder="Confirm new password"
               minlength="8"
               maxlength="72"
               autocomplete="new-password"
               required>

        <button type="submit">
            Update Password
        </button>

    </form>

    <p class="message">
        <a th:href="@{/login}">Back to Login</a>
    </p>

</div>

</body>
</html>
