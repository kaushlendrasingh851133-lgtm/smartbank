<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartBank | Transfer Money</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fc;
            color: #172b4d;
        }

        header {
            background: #102f5c;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
        }

        .brand span {
            color: #7db4ff;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        main {
            max-width: 650px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px #172b4d0c;
        }

        h1 {
            margin-top: 0;
            font-size: 27px;
        }

        .subtitle {
            color: #667085;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 20px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #155eef;
            box-shadow: 0 0 0 3px #155eef15;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #155eef;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #104ac0;
        }

        .message {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            overflow-wrap: anywhere;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .notice {
            margin-top: 22px;
            padding: 14px;
            background: #e8f1ff;
            color: #244a7c;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 500px) {
            header {
                padding: 16px;
            }

            .brand {
                font-size: 21px;
            }

            main {
                margin-top: 25px;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">Smart<span>Bank</span></div>
    <a class="back" th:href="@{/dashboard}">← Dashboard</a>
</header>

<main>
    <div class="card">

        <h1>💸 Transfer Money</h1>

        <p class="subtitle">
            Transfer funds securely to another verified SmartBank account.
        </p>

        <div class="message success"
             th:if="${transferSuccess}"
             th:text="${transferSuccess}">
        </div>

        <div class="message error"
             th:if="${transferError}"
             th:text="${transferError}">
        </div>

        <form th:action="@{/transfer}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <label for="receiverAccountNumber">
                Receiver Account Number
            </label>

            <input
                    type="text"
                    id="receiverAccountNumber"
                    name="receiverAccountNumber"
                    maxlength="16"
                    required
                    autocomplete="off"
                    placeholder="Enter receiver's account number">

            <label for="amount">Transfer Amount (₹)</label>

            <input
                    type="number"
                    id="amount"
                    name="amount"
                    min="0.01"
                    max="1000000"
                    step="0.01"
                    required
                    placeholder="Enter amount">

            <button type="submit">Transfer Money</button>

        </form>

        <div class="notice">
            <strong>Security Notice:</strong>
            Transfers are allowed only between active, verified accounts.
            Never enter your own account number as the receiver.
            This project does not transfer real money.
        </div>

    </div>
</main>

</body>
</html>
