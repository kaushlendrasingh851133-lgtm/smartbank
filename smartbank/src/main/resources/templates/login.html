<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartBank | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef3fa;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 360px;
            max-width: 92%;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px #142b4d18;
        }

        h1 {
            color: #123b72;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #344054;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 8px;
            background: #155eef;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #104ac0;
        }

        .forgot {
            text-align: right;
            margin-top: 12px;
            font-size: 13px;
        }

        .message {
            text-align: center;
            margin-top: 18px;
        }

        a {
            color: #155eef;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .error {
            color: #c62828;
            text-align: center;
        }

        .success {
            color: #188038;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>SmartBank</h1>

    <p class="subtitle">
        Welcome back to your banking dashboard
    </p>

    <!-- Login Error -->
    <p class="error" th:if="${param.error}">
        Invalid email or password.
    </p>

    <!-- Registration Success -->
    <p class="success" th:if="${param.registered}">
        Registration successful! Please log in.
    </p>

    <!-- Logout Success -->
    <p class="success" th:if="${param.logout}">
        You have logged out successfully.
    </p>

    <!-- Password Reset Success -->
    <p class="success" th:if="${param.passwordReset}">
        Password reset successful! Please login with your new password.
    </p>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post">

        <label>Email Address</label>

        <input type="email"
               name="username"
               placeholder="Enter your email"
               autocomplete="username"
               required>

        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Enter your password"
               autocomplete="current-password"
               required>

        <!-- Forgot Password -->
        <div class="forgot">
            <a th:href="@{/forgot-password}">
                Forgot Password?
            </a>
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <!-- Registration Link -->
    <p class="message">
        New to SmartBank?
        <a th:href="@{/register}">
            Create Account
        </a>
    </p>

</div>

</body>
</html>
