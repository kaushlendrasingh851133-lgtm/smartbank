<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Account | SmartBank</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #071b3a, #0b4b91, #1688d4);
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 38px 30px;
            border-radius: 22px;
            background: #ffffff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 27px;
            font-weight: bold;
            color: #0754a5;
            margin-bottom: 25px;
        }

        .icon {
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e8f2ff;
            font-size: 35px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            color: #142b49;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .message {
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .success {
            color: #166534;
            background: #dcfce7;
        }

        .error {
            color: #991b1b;
            background: #fee2e2;
        }

        .demo {
            color: #854d0e;
            background: #fef3c7;
            border: 1px solid #fde68a;
            text-align: center;
            font-weight: bold;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 9px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #1478d4;
            box-shadow: 0 0 0 3px rgba(20, 120, 212, 0.12);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0754a5, #1688d4);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-bottom: 15px;
        }

        .btn:hover {
            opacity: 0.92;
        }

        .btn:active {
            transform: scale(0.99);
        }

        .note {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 12px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #0754a5;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🏦 SmartBank</div>

    <div class="icon">🔐</div>

    <h1>Verify Your Account</h1>

    <p class="subtitle">
        Complete account verification using a one-time password (OTP).
        Your account must be verified before banking transactions.
    </p>

    <div th:if="${successMessage}"
         class="message success"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="message error"
         th:text="${errorMessage}">
    </div>

    <!-- Local development demo only -->
    <div th:if="${demoOtp}" class="message demo">
        OTP:
        <span th:text="${demoOtp}"></span>
        <br>
        <small>Expires in 5 minutes.</small>
    </div>

    <!-- Generate OTP Form -->
    <form th:action="@{/verify-account/send-otp}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit" class="btn">
            Generate OTP
        </button>

        <p class="note">
            For account Verification only...
        </p>

    </form>

    <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 22px 0;">

    <!-- Verify OTP Form -->
    <form th:action="@{/verify-account/confirm}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="otp">Enter 6-Digit OTP</label>

        <input
                type="text"
                id="otp"
                name="otp"
                placeholder="Enter your OTP"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                minlength="6"
                autocomplete="one-time-code"
                required
        >

        <button type="submit" class="btn">
            Verify Account
        </button>

    </form>

    <a th:href="@{/dashboard}" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
